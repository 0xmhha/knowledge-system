<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:"><title>Local retained review diagrams</title><style>body{font:16px Arial;background:#fff;color:#172033;margin:32px}section{padding:24px;border:1px solid #ccd2da;margin:20px 0}svg{max-width:100%;height:auto}pre{white-space:pre-wrap}</style><script src="/mermaid.min.js"></script></head><body><h1>Retained review diagrams</h1><p>Computed local structure. Independent semantic acceptance: not recorded.</p><section><h2>Bounded CFG</h2><div id="sequence"></div></section><section><h2>Retained file membership</h2><div id="modules"></div></section><pre id="result">rendering</pre><script>
const inputs={"sequence.mmd": "flowchart TD\n%% Computed bounded CFG; runtime feasibility, calls and exceptions remain unknown.\n  empty[\"No CFG successors; no safety conclusion\"]\n", "modules.mmd": "flowchart LR\n%% Computed retained-file membership; interprocedural edges are unknown.\n  file[\"eth/downloader/api.go\"] -->|computed membership| symbol[\"Selected retained function\"]\n  symbol -.->|unknown, not computed| external[\"Interprocedural relationships unavailable\"]\n"};
window.renderResult={complete:false,errors:[],svg:[]};
(async()=>{try{mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'default'});for(const [name,source]of Object.entries(inputs)){const id=name.split('.')[0];const r=await mermaid.render('mermaid_'+id,source);document.getElementById(id).innerHTML=r.svg;const svg=document.getElementById(id).querySelector('svg');window.renderResult.svg.push({name,viewBox:svg.getAttribute('viewBox'),text:svg.textContent});}window.renderResult.complete=true;}catch(e){window.renderResult.errors.push(String(e));}document.getElementById('result').textContent=JSON.stringify(window.renderResult,null,2);})();
</script></body></html>
