[project]
name = "ks-setup"
version = "0.1.0"
description = "Guided, progress-tracked dataset setup for the knowledge system"
requires-python = ">=3.9"
dependencies = ["rich>=13"]

[project.scripts]
ks-setup = "ks_setup.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ks_setup"]
