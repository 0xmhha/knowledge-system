name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Lint (gofmt drift, vet, engine boundaries)
        run: make lint
      - name: Test (race)
        run: make test-race
      - name: Domain artifacts match their entries
        run: make check-domain-artifacts

  # Successor of code-knowledge-vector's eval-gate job: recall regression
  # gate over the vendored sample corpus with the deterministic mock
  # embedder — no network, no model downloads.
  eval-gate-vector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build index + eval (mock embedder, recall@5 >= 0.5)
        run: |
          TMP_OUT=$(mktemp -d)
          go run ./cmd/vector build --embedder=mock --src ./vector/testdata/sample --out "$TMP_OUT"
          go run ./cmd/vector eval  --embedder=mock --fixture ./vector/testdata/queries.yaml \
            --out "$TMP_OUT" --src ./vector/testdata/sample \
            --min-recall5 0.5 --json
          rm -rf "$TMP_OUT"

  # Successor of code-knowledge-graph's eval job: `make -C graph eval`
  # self-indexes the graph engine and `cks eval-gate` compares the four probe
  # outputs against the committed baseline (retrieval drift <= 0.02,
  # validate issue count must not rise). Runs in parallel with
  # build-and-test — the two are independent signals.
  eval-gate-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The temporal pass (G6) walks git history; the committed baseline
          # was built from a full-history clone, so a shallow CI clone would
          # index a different corpus.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Self-indexing also loads retained source modules captured with Go 1.26.
          go-version: '1.26.8'
      - name: make eval (self-index + 4 probes)
        run: make -C graph eval
      - name: eval-gate (compare against committed baseline)
        run: go run ./cmd/cks eval-gate --baseline graph/eval/baseline --latest graph/eval/results/latest
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-latest
          path: graph/eval/results/latest/

  vuln-scan:
    runs-on: ubuntu-latest
    # Advisory-only: the vulnerability DB moves independently of this repo,
    # so new findings should not block unrelated changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          # Current govulncheck requires Go 1.26; app/native checks keep go.mod.
          go-version: '1.26.8'
      - name: govulncheck
        run: make vuln

  # Native job runner, not an ARM-host QEMU/Docker compatibility result.
  # Mock wiring/consumer proof stays separate from N11 gold and release gates.
  native-install-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build extracted host package and exercise mock installs
        env:
          KS_PACKAGE_SMOKE_DIR: ${{ runner.temp }}/ks-native-package
        run: bash scripts/wbs-package-smoke.sh
      - name: Separate-module public consumer and negative controls
        run: >-
          python3 scripts/wbs-external-consumer-smoke.py
          --package-root "${{ runner.temp }}/ks-native-package"
          --out-dir "${{ runner.temp }}/ks-external-consumer"
          --expect-os linux --expect-arch amd64

      - name: Small owned-fixture backup restore and source-absent replay
        run: |
          for task_stage in "${{ runner.temp }}"/ks-native-package/unpacked/*; do
            python3 scripts/wbs-recovery-smoke.py --bin-dir "$task_stage" \
              --out "${{ runner.temp }}/ks-native-recovery"
          done
      - name: Retain native mock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-install-contract-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ks-native-package/package.json
            ${{ runner.temp }}/ks-native-package/installs/**/*.json
            ${{ runner.temp }}/ks-native-package/unpacked/**/manifest.json
            ${{ runner.temp }}/ks-external-consumer/*.json
            ${{ runner.temp }}/ks-external-consumer/*.stdout.txt
            ${{ runner.temp }}/ks-external-consumer/*.stderr.txt
            ${{ runner.temp }}/ks-native-recovery/*.json
            ${{ runner.temp }}/ks-native-recovery/*.stdout.txt
            ${{ runner.temp }}/ks-native-recovery/*.stderr.txt
            ${{ runner.temp }}/ks-native-recovery/pin-control/*.json
            ${{ runner.temp }}/ks-native-recovery/pin-control/server.log
