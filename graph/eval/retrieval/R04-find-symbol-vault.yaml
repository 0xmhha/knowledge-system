id: R04-find-symbol-vault
description: |
  find_symbol with the bare name "Vault" and exact=false matches the
  qualified name or its last segment in the caller's case: the lookup
  uses the NOCASE simple_name index and then compares again in binary,
  so "Vault" does not return the fields named `vault`
  (api.Handler.vault, service.SafeVault.vault). Before that rule a
  case-insensitive LIKE returned them; a regression back to it fails
  the precision gate.
probe:
  tool: find_symbol
  args:
    name: "Vault"
    exact: false
expected:
  # A qualified name two declarations share (the TypeScript class and the
  # Solidity contract are both "Vault") is printed and scored in the site
  # form <qname>@<file>:<line>, the name that opens exactly one node.
  symbols:
    - "Vault@ts-frontend/src/contracts/Vault.ts:2"   # TS class
    - "Vault@sol-contract/contracts/Vault.sol:3"     # Solidity contract
    - "service.Vault"                                # Go struct
scoring:
  recall_min: 1.0
  precision_min: 1.0
