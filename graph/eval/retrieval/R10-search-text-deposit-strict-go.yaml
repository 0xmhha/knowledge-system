id: R10-search-text-deposit-strict-go
description: |
  Single-keyword precision target: "Deposit" with language=go must
  return every Go declaration whose name/qname or search_tokens contain
  the token "deposit". Since schema 1.13 the search_tokens column carries
  camelCase-split tokens, so HandleDeposit and SafeDeposit match via the
  "deposit" sub-token.

  The probe runs the search_text tool's default path (no node_kinds), as
  an MCP client calls it: the tool's default filter leaves out whatever is
  declared inside a function body, so `var req` in HandleDeposit (stored
  as a Variable node, api.Handler.HandleDeposit.req, while `:=` locals are
  LocalVariable nodes) is not an expected result.
probe:
  tool: search_text
  args:
    query: "Deposit"
    language: "go"
    top_k: 20
expected:
  symbols:
    - service.Vault.Deposit
    - domain.DepositRequest
    - domain.DepositRequest.Amount
    - domain.DepositRequest.From
    - api.Handler.HandleDeposit            # matched via search_tokens camelCase split (schema 1.13)
    - service.SafeVault.SafeDeposit        # matched via search_tokens camelCase split
scoring:
  recall_min: 1.0
  precision_min: 1.0
