id: R09-search-text-vault-language-sol
description: |
  Language filter pushdown over Solidity: "Vault" with language=sol
  returns only Sol nodes whose FTS-indexed columns contain the token.
  Pairs with R08 to lock the language pushdown for all three supported
  languages. The Sol synthetic corpus has a single "Vault" contract,
  so this fixture also doubles as a "no cross-language bleed" guard.
probe:
  tool: search_text
  args:
    query: "Vault"
    language: "sol"
    top_k: 20
expected:
  # A qualified name two declarations share (the TypeScript class and the
  # Solidity contract are both "Vault") is printed and scored in the site
  # form <qname>@<file>:<line>, the name that opens exactly one node.
  symbols:
    - Vault@sol-contract/contracts/Vault.sol:3          # contract
    - Vault.deposit@sol-contract/contracts/Vault.sol:9  # method (qname carries "vault" via contract prefix)
    - Vault.nonZero                      # modifier
    - Vault.Deposited                    # event (qname carries "vault" via contract prefix)
    - Vault.balances                     # mapping state variable (same)
    - file:sol-contract/contracts/Vault.sol
scoring:
  recall_min: 1.0
  precision_min: 1.0
