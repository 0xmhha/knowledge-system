id: R02-find-callees-handle-deposit
description: |
  find_callees forward traversal: api.Handler.HandleDeposit calls
  service.Vault.Deposit. Mirror of R01 to cover both traversal
  directions through the same call edge.
probe:
  tool: find_callees
  args:
    qname: "api.Handler.HandleDeposit"
    depth: 2
expected:
  symbols:
    - "service.Vault.Deposit"
    # Calls outside the build point at External nodes (schema 1.36).
    - "http.Error"
    - "http.ResponseWriter.WriteHeader"
    - "json.Decoder.Decode"
    - "json.NewDecoder"
    # err.Error() in both error branches: the method of the builtin error
    # interface, a real callee.
    - "builtin.error.Error"
scoring:
  recall_min: 1.0
  precision_min: 0.0
