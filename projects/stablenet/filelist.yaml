# Build profile of the stablenet knowledge dataset: the options of the build
# the graph follows and the files outside the Go build that belong to it.
# The scope is extracted from it before every graph build
# (docs/graph/CKG-STRUCTURE.md section 1.1):
#
#   ckg scope --src <go-stablenet checkout> \
#     --profile projects/stablenet/filelist.yaml --out <dataset>/build-scope.json
#   ckg build --src <go-stablenet checkout> --scope <dataset>/build-scope.json ...
#
# cks setup runs the same two steps when its config names this file. Options
# of a build that differs (--goos/--goarch/--cgo/--tags on ckg scope,
# --build-* on cks setup) override the values below for that run.
# Changing anything here changes the dataset scope.

# Deployment target context (R9). go list file sets are build-constraint
# sensitive; the scope is what ships: linux/amd64, cgo on.
# Tags are the ones the go-stablenet Makefile target gstable builds with: build/ci.go doInstall adds
# urfave_cli_no_docs, and ckzg on every builder but Ubuntu trusty.
build_context:
  goos: linux
  goarch: amd64
  cgo: true
  tags: [urfave_cli_no_docs, ckzg]

# Shipped binaries whose dependency closures define the core scope (R4).
build_roots:
  - ./cmd/gstable
  - ./cmd/genesis_generator

# Tests of every package in the closure (R2).
include_package_tests: true

# go:embed files of closure packages (compiled contract artifacts) stay out:
# the .sol sources below are the readable representation, the artifacts are
# derived binaries. The scope still lists them as embed_files.
include_embed_files: false

# Exceptions: code the gstable build does not compile that belongs to the
# scope because the compiled code cannot be understood without it. Each needs
# an id and a reason; linked_by names what the build must still produce, so
# extraction fails once the reason is gone. Files they add carry the id as
# included_by in the scope.
inclusions:
  - id: system-contracts
    reason: >
      The governance and native-coin contracts deployed at genesis.
      systemcontracts/contracts.go embeds their compiled bytecode
      (go:embed artifacts/v1/*), built from solidity/v1 by
      systemcontracts/compile, and the Go code calls them by address.
      Their test contracts are kept as usage examples.
    files:
      - "systemcontracts/**/*.sol"
    linked_by:
      embed:
        - "systemcontracts/artifacts/v1/*"
  - id: system-contract-tooling
    reason: >
      The end-to-end tests of the system contracts and the solc tooling
      that compiles them into the embedded artifacts; no shipped binary
      imports these packages.
    go_packages:
      - ./systemcontracts/test
      - ./systemcontracts/compile/...

exclude_globs: []

# Pull request numbers in commit subjects come from two repositories: the
# fork carries go-ethereum's history up to the release it was forked from
# (params: release Geth v 1.13.15), and the numbers in those commits are
# go-ethereum pull requests. That commit and every commit reachable from it
# are upstream commits; the later ones are the fork's own. The fork's own
# repository name is read from the origin remote (repo: owner/name sets it).
history:
  upstream:
    repo: ethereum/go-ethereum
    base: c5ba367eb6232e3eddd7d6226bfd374449c63164
