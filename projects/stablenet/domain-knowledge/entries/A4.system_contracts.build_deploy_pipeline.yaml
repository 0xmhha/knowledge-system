id: A4.system_contracts.build_deploy_pipeline
subsystem: A4
knowledge_type: B3
title: "System contract lifecycle: Solidity source to genesis state and e2e tests"
summary: |
  System contracts travel a five-stage pipeline. (1) Solidity sources live
  under systemcontracts/solidity/ (v1/, v2/, plus abstracts/, interfaces/,
  libraries/, openzeppelin/ shared code and test/ contracts). (2) The Go
  tool systemcontracts/compile invokes pinned solc 0.8.14 on them.
  (3) Compiled bytecode lands in systemcontracts/artifacts/{v1,v2}/ as
  hex-encoded files — codegen output, never hand-edited. (4) Native Go
  loads the artifacts at process start: go:embed directives in
  contracts.go populate SystemContractCodes; at genesis,
  core.InjectContracts -> GetSystemContractsTransition turns them into
  CodeParam/state entries so the chain database is initialized with the
  contracts' code and storage. (5) systemcontracts/test/ exercises the
  whole chain end to end (native + governance flows against a simulated
  backend). Consequence for indexing/search: the shipped binary depends on
  .sol sources through the embedded artifacts even though `go list` never
  sees them — a build-graph-only view misses stages 1-3 and 5
  (systemcontracts/test is outside the dependency graph, and the compile
  tool is its own main). The knowledge dataset scope therefore adds them
  explicitly (projects/stablenet/filelist.yaml: extra_packages
  systemcontracts/test + systemcontracts/compile/..., extra_globs
  systemcontracts/**/*.sol).
code_anchors:
  - file: systemcontracts/solidity/v1
    reason: "stage 1: governance v1 Solidity sources (v2/ for GovMinter v2; test/ holds test contracts)"
  - file: systemcontracts/compile/main.go
    reason: "stage 2 entry point: compiles v1+v2 sources and exports bytecode"
  - file: systemcontracts/compile/compiler/compiler.go
    symbol: solcVersion
    line: 37
    reason: "pinned solc 0.8.14; artifacts are only reproducible under this version"
  - file: systemcontracts/contracts.go
    symbol: SystemContractCodes
    line: 37
    reason: "stage 3->4 boundary: go:embed lines (37-52) load artifacts/{v1,v2} into the version-keyed code map"
  - file: systemcontracts/systemcontracts.go
    symbol: GetSystemContractsTransition
    line: 78
    reason: "stage 4: builds the genesis StateTransition (code + initialized storage) from SystemContractCodes"
  - file: core/genesis.go
    symbol: InjectContracts
    line: 735
    reason: "stage 4 call-site: applies the transition to genesis so the chain DB starts with the contracts"
  - file: systemcontracts/test/coin_adapter_test.go
    reason: "stage 5: representative of systemcontracts/test/ — 25 e2e tests over the full pipeline, a package outside the build dependency graph"
procedure_steps:
  - "Trace a contract change forward: .sol edit -> `go run ./systemcontracts/compile` -> artifacts/{v1,v2} diff -> embedded map -> genesis injection -> systemcontracts/test."
  - "Trace a genesis-state question backward: InjectContracts -> GetSystemContractsTransition -> SystemContractCodes -> go:embed artifact -> the .sol source that produced it."
  - "For the regeneration how-to (commands, new-version wiring, do-not-edit rules) see A10.codegen.contract_regen_procedure."
