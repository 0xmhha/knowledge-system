invariants:
  - "The AnzeonTipEnv refresh guard covers every header field its readers use: a block whose state root is unchanged but whose header GasTip differs is re-read."
  - "Every txpool comparison of a transaction tip against the pool threshold uses the same quantity, the effective Anzeon tip (GetAnzeonTipCap, falling back to GasTipCap)."
  - "The per-transaction anzeonTipCap is set once during validation and is not cleared on reinjection."

pitfalls:
  - "Clearing every transaction's anzeonTipCap in SetGasTip to apply a new tip — contradicts the reinjection intent in validation.go and leaves the stale header in AnzeonTipEnv; symptom persists on blocks without state change."
  - "Keying the AnzeonTipEnv refresh on the state root only — blocks without state change keep the old header, so readers see the old GasTip until the next state-changing block (symptom: old tip for a while after the change, then recovers)."
  - "Comparing raw GasTipCap against the threshold in one consumer while another uses the effective tip — the two paths disagree about which transactions are below the tip."
  - "Reproducing with transactions flowing after the change — each block changes the state root and refreshes the env, so the symptom does not show; hold a window of blocks without transactions after the change."

