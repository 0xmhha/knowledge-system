id: A6.anzeon_gas.tip_refresh_pitfalls
subsystem: A6
knowledge_type: B5
title: "Anzeon gas tip change not applied — refresh guard and tip consumers, not the per-tx cache"

summary: |
  Symptom: after a governance change of the gas tip, the txpool keeps
  deciding with the old tip for a while and then recovers. The tempting
  reading is "a cache was not cleared", and the tempting fix is to clear
  the per-transaction tip cache. That fix is wrong for this code.

  Two places decide which tip is seen. AnzeonTipEnv.SetCurrentBlock
  re-reads the block it caches only when its refresh guard says the
  block changed. A block with no state change keeps the same state root
  while its header already carries the new GasTip, so a guard keyed on
  the root alone keeps the old header, and every reader of
  currentBlock.GasTip() sees the old tip until some later block changes
  the state. The guard has to compare the header GasTip as well
  (gasTipChanged). Separately, the txpool consumers that compare a
  transaction's tip with the pool threshold must all compare the same
  quantity: RemotesBelowTip compares the effective Anzeon tip
  (GetAnzeonTipCap, falling back to GasTipCap), as Pending does.

  The per-transaction anzeonTipCap cache is set once during validation
  and is kept on purpose across reinjection (validation.go comment
  "Only cache if not already set (to preserve original value during
  reinject)"). Clearing it on every SetGasTip contradicts that intent
  and does not fix the stale header.

