id: go-stablenet
name: "go-stablenet"
description: "geth fork — WBFT BFT consensus, native stablecoin (WKRC), governance system contracts"

# Machine-independent. The working-tree path varies per machine, so it is NOT
# committed here: it is supplied at runtime via env. Set CKS_CODE_ROOT to your
# go-stablenet checkout — the loader reads the env var directly (load.go step 1)
# and the committed value below expands the same variable (step 2), so a single
# variable serves both resolution paths.
code_root: ${CKS_CODE_ROOT}

# Verification baseline (machine-independent, reproducible anywhere): the
# go-stablenet commit the entries' code_anchors were confirmed against.
code_commit: ec6a4e96b   # dev — anchor re-verification baseline, 2026-06-09

primary_language: go
secondary_languages:
  - solidity

domain: blockchain
domain_tags:
  - ethereum-fork
  - bft-consensus
  - stablecoin
  - evm
  - geth-derived

schema_version: 1

indexing:
  ckv_index_path: ".ckv-data/go-stablenet"
  ckg_index_path: ".ckg-data/go-stablenet"
  glossary_path: "glossary.yaml"

# The embedding corpus is generated entirely from this pack's committed
# data (domain-knowledge entries + flow corpus). The checkout referenced
# by code_root is the source tree being indexed — the build takes no
# documentation from it. (Its untracked .claude/ skills project is a
# separate concern and deliberately not a build input.)
