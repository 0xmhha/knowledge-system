version: 1
name: mcp-tool-handlers
description: |
  Locate the MCP server's tool registration + per-tool handlers
  (cks.context.get_for_task, cks.ops.health). A coding-agent
  developer asking "how does cks expose its surface?" should land
  on Register, handleGetForTask, and handleHealth. Spanning three
  files makes this a graph-traversal heavy scenario.
prompt: "cks MCP server tool registration and handlers for get_for_task and health"
intent: arch_explain
match_mode: overlap
runs: 5
expected_citations:
  - file: internal/system/mcp/server.go
    start_line: 100
    end_line: 143       # Register (re-anchored 2026-07-29)
    anchor: "func Register("
  - file: internal/system/mcp/get_for_task.go
    start_line: 13
    end_line: 60        # handleGetForTask (re-anchored 2026-07-29)
    anchor: "func handleGetForTask("
  - file: internal/system/mcp/health.go
    start_line: 63
    end_line: 125       # handleHealth (re-anchored 2026-07-29)
    anchor: "func handleHealth("
