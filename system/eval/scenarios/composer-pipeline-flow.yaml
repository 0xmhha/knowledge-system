version: 1
name: composer-pipeline-flow
description: |
  Find the end-to-end composer pipeline — the Compose method that
  drives intent → stage1 → stage2 → stage3 → budget → sanitize →
  pack assembly, plus the assemblePack helper that does the final
  citation/body/neighbor shaping. These two functions are the spine
  of every cks evidence pack; missing either signals a serious
  retrieval failure.

  Note (2026-08-03): assemblePack is reachable only through the graph for
  this prompt. Its chunk is about assembling the pack, not about chaining
  stages, so ckv legitimately ranks it outside the top ten — adding "and
  assemble the final pack" to the query brings it to ckv rank 9, which is
  what proves the wording is the reason. The calls edge from Compose is
  what bridges the gap, and the pack does deliver it. So this scenario's
  low MRR measures the cost of graph-bridged evidence, not a retrieval
  defect; do not read it as something to fix in search.
prompt: "how does composer Compose chain the stages end to end"
intent: arch_explain
match_mode: overlap
runs: 5
# The pack's knowledge section is invisible to recall/MRR, so it needs its
# own guard. This prompt reliably surfaces the composer packages' synthesized
# convention summaries; if knowledge delivery breaks the way it was broken
# before #72, this fails loudly instead of scoring a clean 1.00.
expected_knowledge:
  - internal/system/composer
  - internal/system/composer/stage2

expected_citations:
  - file: internal/system/composer/composer.go
    start_line: 134
    end_line: 260       # Compose entry family + pipeline body (re-anchored 2026-07-29)
    anchor: "func (c *Composer) Compose("
  - file: internal/system/composer/composer.go
    start_line: 348
    end_line: 420       # assemblePack (re-anchored 2026-07-29)
    anchor: "func assemblePack("
