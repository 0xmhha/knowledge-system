version: 1
name: stamp-integrity-lookup
description: |
  Locate the SHA-256 integrity-stamping logic on EvidencePack.
  Ground truth picks the three pure functions that own the stamp +
  verify lifecycle. Recall failure here means cks missed the public
  Compute/Stamp/Verify trio that callers rely on; precision failure
  means cks pulled in unrelated pack code.
prompt: "EvidencePack integrity hash stamping and verification"
intent: arch_explain
match_mode: overlap
runs: 5
expected_citations:
  - file: pkg/system/contract/pack.go
    start_line: 258
    end_line: 275       # ComputeIntegrityHash (re-anchored 2026-07-29)
    anchor: "func ComputeIntegrityHash("
  - file: pkg/system/contract/pack.go
    start_line: 277
    end_line: 292       # StampIntegrity (re-anchored 2026-07-29)
    anchor: "func StampIntegrity("
  - file: pkg/system/contract/pack.go
    start_line: 294
    end_line: 312       # VerifyIntegrity (re-anchored 2026-07-29)
    anchor: "func VerifyIntegrity("
